name: PR-Agent Reviewer

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@4ebd5c5333c6ef21509e7304d27969eb825e6f22 # v0.43.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ.KEY: ${{ secrets.GROQ_API_KEY }}
          config.model: "groq/llama3-70b-8192"
          config.fallback_models: '["groq/llama3-70b-8192"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          pr_reviewer.num_code_suggestions: "4"
          pr_reviewer.inline_code_comments: "true"
          pr_reviewer.require_score_review: "true"
          pr_reviewer.require_tests_review: "true"